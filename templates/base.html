<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Media Compass{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='enhancements.css') }}">
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">Media Compass</a>
    <nav aria-label="Main navigation">
      <a href="{{ url_for('index') }}">Library</a>
      <a href="{{ url_for('compare') }}">Compare</a>
      <a href="{{ url_for('profile_settings') }}">Preferences</a>
      <a href="{{ url_for('status') }}">Data status</a>
      <a href="{{ url_for('methodology') }}">Methodology</a>
    </nav>
    <a class="profile-chip" href="{{ url_for('profile_settings') }}">{{ profile.display_name }} · age {{ profile.age }}</a>
  </header>
  <main class="page-shell">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
